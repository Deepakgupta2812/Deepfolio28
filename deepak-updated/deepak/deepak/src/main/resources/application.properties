spring.application.name=portfolio
server.port=${PORT:8080}

# ---------------------------------------------------------------
# Database. Credentials come from environment variables so nothing
# sensitive is committed. For local development either export these
# or put them in an untracked application-local.properties.
# ---------------------------------------------------------------
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/portfolio_db}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:841435}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Buffer full Thymeleaf output before writing to response
# Prevents "response already committed" errors on template exceptions
spring.thymeleaf.servlet.produce-partial-output-while-processing=false

# Cache static assets in the browser (CSS/JS/images served from /static)
spring.web.resources.cache.cachecontrol.max-age=7d
spring.web.resources.cache.cachecontrol.cache-public=true

# Default admin account created on first start. Change the password
# from Admin > Settings after logging in the first time.
app.admin.username=${ADMIN_USERNAME:Deepak}
app.admin.password=${ADMIN_PASSWORD:admin123}

# Explicit MySQL dialect for Hibernate 7 / Spring Boot 4.
# This prevents startup failure when JDBC metadata is temporarily unavailable.
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
