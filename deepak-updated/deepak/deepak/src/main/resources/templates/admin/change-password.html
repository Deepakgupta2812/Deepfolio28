<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Change Password | Admin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>

<div class="admin-container">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="admin-content">

        <div class="admin-header">
            <div>
                <h1>Change Password</h1>
                <p>Update your admin account password.</p>
            </div>
        </div>

        <div th:if="${success}" class="login-success">
            <i class='bx bx-check-circle'></i>
            <p th:text="${success}">Password changed successfully!</p>
        </div>

        <div th:if="${error}" class="login-error">
            <i class='bx bx-error-circle'></i>
            <p th:text="${error}">Password change failed.</p>
        </div>

        <div class="form-container">

            <form th:action="@{/admin/change-password}" th:object="${passwordChangeRequest}" method="post">

                <label for="currentPassword">Current Password</label>
                <div class="password-field">
                    <input type="password" id="currentPassword" th:field="*{currentPassword}"
                           placeholder="Enter current password" required>
                    <button type="button" class="password-toggle" data-target="currentPassword">
                        <i class='bx bx-show'></i>
                    </button>
                </div>
                <p class="field-error" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></p>

                <label for="newPassword">New Password</label>
                <div class="password-field">
                    <input type="password" id="newPassword" th:field="*{newPassword}"
                           placeholder="Enter new password" required>
                    <button type="button" class="password-toggle" data-target="newPassword">
                        <i class='bx bx-show'></i>
                    </button>
                </div>
                <p class="field-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></p>

                <label for="confirmPassword">Confirm New Password</label>
                <div class="password-field">
                    <input type="password" id="confirmPassword" th:field="*{confirmPassword}"
                           placeholder="Confirm new password" required>
                    <button type="button" class="password-toggle" data-target="confirmPassword">
                        <i class='bx bx-show'></i>
                    </button>
                </div>
                <p class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></p>

                <div class="form-buttons">
                    <button type="submit" class="save-btn">
                        <i class='bx bx-save'></i> Change Password
                    </button>

                    <a th:href="@{/admin/dashboard}" class="cancel-btn">
                        <i class='bx bx-x'></i> Cancel
                    </a>
                </div>

            </form>

        </div>

    </main>

</div>

<script th:src="@{/js/admin.js}"></script>

</body>
</html>
