<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Certificates | Admin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>

<div class="admin-container">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="admin-content">

        <div class="admin-header">
            <div>
                <h1>Manage Certificates</h1>
                <p>Everything shown in the Certificates section of your portfolio.</p>
            </div>

            <a th:href="@{/admin/certificates/add}" class="add-btn">
                <i class='bx bx-plus'></i> Add Certificate
            </a>
        </div>

        <div class="admin-alert admin-alert-success" th:if="${success}" th:text="${success}"></div>

        <div class="table-container">

            <table>

                <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Organization</th>
                    <th>Issue Date</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="certificate : ${certificates}">
                    <td><span class="id-badge" th:text="${certificate.id}">1</span></td>
                    <td th:text="${certificate.title}"></td>
                    <td th:text="${certificate.organization}"></td>
                    <td th:text="${certificate.issueDate != null ? #temporals.format(certificate.issueDate, 'dd MMM yyyy') : ''}"></td>
                    <td>
                        <a th:href="@{/admin/certificates/edit/{id}(id=${certificate.id})}" class="edit-btn">
                            <i class='bx bx-edit-alt'></i> Edit
                        </a>

                        <form th:action="@{/admin/certificates/delete/{id}(id=${certificate.id})}"
                              method="post" style="display: inline;"
                              onsubmit="return confirm('Are you sure you want to delete this certificate?')">

                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                            <button type="submit" class="delete-btn">
                                <i class='bx bx-trash'></i> Delete
                            </button>
                        </form>
                    </td>
                </tr>

                <tr class="empty-row" th:if="${certificates == null or #lists.isEmpty(certificates)}">
                    <td colspan="5">No certificates yet. Click "Add Certificate" to create your first one.</td>
                </tr>

                </tbody>

            </table>

        </div>

    </main>

</div>

</body>
</html>
