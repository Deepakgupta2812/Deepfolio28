<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Education Form | Admin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>

<div class="admin-container">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="admin-content">

        <div class="form-container">

            <h1 th:text="${education.id == null ? 'Add Education' : 'Edit Education'}">Education Form</h1>
            <p>Appears in the Education timeline on your public portfolio.</p>

            <form th:action="@{/admin/education/save}" th:object="${education}" method="post">

                <input type="hidden" th:field="*{id}">

                <label>Degree</label>
                <input type="text" th:field="*{degree}" required
                       placeholder="B.Tech — Computer Science &amp; Engineering">

                <label>Institution</label>
                <input type="text" th:field="*{institution}"
                       placeholder="Bansal Institute of Engineering &amp; Technology, Lucknow">

                <label>University / Board</label>
                <input type="text" th:field="*{board}" placeholder="AKTU">

                <label>Start year</label>
                <input type="number" th:field="*{startYear}" min="1950" max="2100" placeholder="2023">

                <label>End year</label>
                <input type="number" th:field="*{endYear}" min="1950" max="2100" placeholder="2027">
                <small class="form-help">Leave blank if you are still studying — it will show as "Present".</small>

                <label>Grade (optional)</label>
                <input type="text" th:field="*{grade}" placeholder="CGPA 8.2">

                <label>Description (optional)</label>
                <textarea th:field="*{description}" rows="4"
                          placeholder="Relevant coursework, achievements, activities"></textarea>

                <div class="form-buttons">
                    <button type="submit" class="save-btn">
                        <i class='bx bx-save'></i> Save Education
                    </button>

                    <a th:href="@{/admin/education}" class="cancel-btn">
                        <i class='bx bx-x'></i> Cancel
                    </a>
                </div>

            </form>

        </div>

    </main>

</div>

</body>
</html>
