<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Form | Admin</title>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div class="admin-container">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="admin-content">
        <div class="form-container">
            <h1 th:text="${event.id == null ? 'Add Event' : 'Edit Event'}">Event Form</h1>
            <p>This appears in the Event Attendance section of your portfolio.</p>
            <form th:action="@{/admin/events/save}" th:object="${event}" method="post" enctype="multipart/form-data">
                <input type="hidden" th:field="*{id}">
                <label>Event name</label><input type="text" th:field="*{title}" placeholder="Java conference" required>
                <label>Date</label><input type="date" th:field="*{eventDate}">
                <label>Venue</label><input type="text" th:field="*{venue}" placeholder="New Delhi, India">
                <label>Description</label><textarea th:field="*{description}" rows="5" placeholder="What did you learn or contribute?"></textarea>
                <label>Event link</label><input type="url" th:field="*{eventUrl}" placeholder="https://...">
                <label>Event image</label><input type="file" name="image" accept="image/png,image/jpeg,image/webp">
                <small class="form-help">Optional. PNG, JPG, or WebP up to 5 MB.</small>
                <img th:if="${event.imageData != null}" th:src="${event.imageData}" alt="Current event" class="certificate-preview">
                <div class="form-buttons">
                    <button type="submit" class="save-btn"><i class='bx bx-save'></i> Save Event</button>
                    <a th:href="@{/admin/events}" class="cancel-btn"><i class='bx bx-x'></i> Cancel</a>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>
