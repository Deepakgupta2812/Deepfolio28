<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Message Details | Admin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>

<div class="admin-container">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="admin-content">

        <div class="message-details">

            <div class="admin-header">
                <h1>Message Details</h1>

                <a th:href="@{/admin/messages}" class="cancel-btn">
                    <i class='bx bx-arrow-back'></i> Back
                </a>
            </div>

            <div class="message-card">

                <div class="message-info">

                    <p>
                        <strong>Name</strong>
                        <span th:text="${contact.name}"></span>
                    </p>

                    <p>
                        <strong>Email</strong>
                        <span th:text="${contact.email}"></span>
                    </p>

                    <p th:if="${contact.subject != null and !contact.subject.isEmpty()}">
                        <strong>Subject</strong>
                        <span th:text="${contact.subject}"></span>
                    </p>

                    <p>
                        <strong>Received</strong>
                        <span th:text="${contact.createdAt}"></span>
                    </p>

                </div>

                <hr>

                <div class="message-content">
                    <h3>Message</h3>
                    <p th:text="${contact.message}"></p>
                </div>

                <br>

                <form th:action="@{/admin/messages/delete/{id}(id=${contact.id})}"
                      method="post"
                      onsubmit="return confirm('Are you sure you want to delete this message?')">

                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                    <button type="submit" class="delete-btn">
                        <i class='bx bx-trash'></i> Delete Message
                    </button>

                </form>

            </div>

        </div>

    </main>

</div>

</body>
</html>
