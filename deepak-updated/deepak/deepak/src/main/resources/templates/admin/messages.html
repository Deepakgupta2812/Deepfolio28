<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Messages | Admin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>

<div class="admin-container">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="admin-content">

        <div class="admin-header">
            <div>
                <h1>Contact Messages</h1>
                <p>Messages submitted through your portfolio's contact form.</p>
            </div>
        </div>

        <div class="table-container">

            <table>

                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Subject</th>
                    <th>Message</th>
                    <th>Received</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="contact : ${contacts}">
                    <td><span class="id-badge" th:text="${contact.id}">1</span></td>
                    <td th:text="${contact.name}"></td>
                    <td th:text="${contact.email}"></td>
                    <td th:text="${contact.subject != null and !contact.subject.isEmpty() ? contact.subject : '—'}"></td>
                    <td th:text="${#strings.abbreviate(contact.message, 50)}"></td>
                    <td th:text="${contact.createdAt}"></td>
                    <td>
                        <a th:href="@{/admin/messages/{id}(id=${contact.id})}" class="edit-btn">
                            <i class='bx bx-show'></i> View
                        </a>

                        <form th:action="@{/admin/messages/delete/{id}(id=${contact.id})}"
                              method="post" style="display: inline;"
                              onsubmit="return confirm('Are you sure you want to delete this message?')">

                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                            <button type="submit" class="delete-btn">
                                <i class='bx bx-trash'></i> Delete
                            </button>
                        </form>
                    </td>
                </tr>

                <tr class="empty-row" th:if="${contacts == null or #lists.isEmpty(contacts)}">
                    <td colspan="7">No messages yet. They'll show up here once visitors contact you.</td>
                </tr>

                </tbody>

            </table>

        </div>

    </main>

</div>

</body>
</html>
