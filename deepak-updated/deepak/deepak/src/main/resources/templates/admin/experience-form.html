<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Experience Form | Admin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>

<div class="admin-container">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="admin-content">

        <div class="form-container">

            <h1 th:text="${experience.id == null ? 'Add Experience' : 'Edit Experience'}">Experience Form</h1>
            <p>Internships, jobs and freelance work.</p>

            <form th:action="@{/admin/experience/save}" th:object="${experience}" method="post">

                <input type="hidden" th:field="*{id}">

                <label>Position</label>
                <input type="text" th:field="*{position}" required placeholder="Java Developer Intern">

                <label>Company</label>
                <input type="text" th:field="*{company}" placeholder="Company name">

                <label>Company URL</label>
                <input type="url" th:field="*{companyUrl}" placeholder="https://company.com">

                <label>Location</label>
                <input type="text" th:field="*{location}" placeholder="Lucknow, India / Remote">

                <label>Start date</label>
                <input type="date" th:field="*{startDate}">

                <label>End date</label>
                <input type="date" th:field="*{endDate}">
                <small class="form-help">Leave blank for a current role — it will show a "Current" badge.</small>

                <label>Description</label>
                <textarea th:field="*{description}" rows="5"
                          placeholder="What you worked on and what you delivered"></textarea>

                <label>Technologies</label>
                <input type="text" th:field="*{technologies}" placeholder="Java, Spring Boot, MySQL">

                <div class="form-buttons">
                    <button type="submit" class="save-btn">
                        <i class='bx bx-save'></i> Save Experience
                    </button>

                    <a th:href="@{/admin/experience}" class="cancel-btn">
                        <i class='bx bx-x'></i> Cancel
                    </a>
                </div>

            </form>

        </div>

    </main>

</div>

</body>
</html>
