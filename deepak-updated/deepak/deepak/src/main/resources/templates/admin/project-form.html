<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Project Form | Admin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>

<div class="admin-container">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="admin-content">

        <div class="form-container">

            <h1 th:text="${project.id == null ? 'Add Project' : 'Edit Project'}">Project Form</h1>
            <p>Fill in the details below — this appears live on your public portfolio.</p>

            <form th:action="@{/admin/projects/save}" th:object="${project}" method="post">

                <input type="hidden" th:field="*{id}">

                <label>Project Title</label>
                <input type="text" th:field="*{title}" placeholder="Enter project title" required>

                <label>Description</label>
                <textarea th:field="*{description}" placeholder="Enter project description" rows="5" required></textarea>

                <label>Technologies</label>
                <input type="text" th:field="*{technologies}" placeholder="Java, Spring Boot, MySQL" required>

                <label>GitHub URL</label>
                <input type="url" th:field="*{githubUrl}" placeholder="https://github.com/...">

                <label>Live Demo URL</label>
                <input type="url" th:field="*{liveUrl}" placeholder="https://example.com">

                <div class="form-buttons">
                    <button type="submit" class="save-btn">
                        <i class='bx bx-save'></i> Save Project
                    </button>

                    <a th:href="@{/admin/projects}" class="cancel-btn">
                        <i class='bx bx-x'></i> Cancel
                    </a>
                </div>

            </form>

        </div>

    </main>

</div>

</body>
</html>
