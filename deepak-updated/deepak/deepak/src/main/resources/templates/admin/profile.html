<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Profile | Admin</title>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div class="admin-container">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="admin-content">
        <div class="profile-stats">
            <div class="stat-box">
                <p class="count" th:text="${visitCount}">0</p>
                <span><i class='bx bx-show'></i> Total profile visits</span>
            </div>
        </div>
        <div class="form-container">
            <h1>Manage Profile</h1>
            <p>Update the personal information, photo, text color, and resume shown on your portfolio.</p>
            <form th:action="@{/admin/profile/save}" th:object="${profile}" method="post" enctype="multipart/form-data">
                <label>Name</label><input type="text" th:field="*{name}" required>
                <label>Headline</label><input type="text" th:field="*{headline}" required>
                <label>Bio</label><textarea th:field="*{bio}" rows="6" placeholder="Tell visitors about yourself"></textarea>

                <label>Profile image</label><input type="file" name="image" accept="image/png,image/jpeg,image/webp">
                <small class="form-help">Optional. PNG, JPG, or WebP up to 5 MB.</small>
                <div th:if="${profile.imageData != null}">
                    <img th:src="${profile.imageData}" alt="Current profile" class="certificate-preview">
                    <label class="checkbox-row">
                        <input type="checkbox" name="removeImage" value="true">
                        Delete current profile image
                    </label>
                </div>

                <label>Profile text color</label>
                <div class="color-picker-row">
                    <input type="color" class="color-picker" th:field="*{textColor}">
                    <small class="form-help">Applied to your name, headline, and bio on the public site.</small>
                </div>

                <label>Resume (PDF)</label><input type="file" name="resume" accept="application/pdf">
                <small class="form-help" th:text="${profile.resumeFileName != null ? 'Current file: ' + profile.resumeFileName : 'Optional. PDF up to 5 MB.'}"></small>
                <div class="form-buttons">
                    <button type="submit" class="save-btn"><i class='bx bx-save'></i> Save Profile</button>
                    <a th:href="@{/}" class="cancel-btn"><i class='bx bx-globe'></i> View Portfolio</a>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>
