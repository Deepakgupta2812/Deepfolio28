<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Events | Admin</title>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div class="admin-container">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="admin-content">
        <div class="admin-header">
            <div><h1>Manage Events</h1><p>Share events, conferences, and meetups you attended.</p></div>
            <a th:href="@{/admin/events/add}" class="add-btn"><i class='bx bx-plus'></i> Add Event</a>
        </div>
        <div class="table-container">
            <table>
                <thead><tr><th>ID</th><th>Event</th><th>Date</th><th>Venue</th><th>Actions</th></tr></thead>
                <tbody>
                <tr th:each="event : ${events}">
                    <td><span class="id-badge" th:text="${event.id}">1</span></td>
                    <td th:text="${event.title}">Event</td>
                    <td th:text="${event.eventDate}">Date</td>
                    <td th:text="${event.venue}">Venue</td>
                    <td>
                        <a th:href="@{/admin/events/edit/{id}(id=${event.id})}" class="edit-btn"><i class='bx bx-edit-alt'></i> Edit</a>
                        <form th:action="@{/admin/events/delete/{id}(id=${event.id})}" method="post" style="display:inline" onsubmit="return confirm('Delete this event?')">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="delete-btn"><i class='bx bx-trash'></i> Delete</button>
                        </form>
                    </td>
                </tr>
                <tr class="empty-row" th:if="${#lists.isEmpty(events)}"><td colspan="5">No events yet. Click "Add Event" to create one.</td></tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>
