<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Deepak Gupta</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="login-icon"><i class='bx bx-lock-alt'></i></div>

        <h1>Admin Login</h1>
        <p>Please sign in to manage your portfolio.</p>

        <p class="login-error" th:if="${param.error}">
            <i class='bx bx-error-circle'></i> Invalid username or password.
        </p>

        <p class="login-success" th:if="${param.logout}">
            <i class='bx bx-check-circle'></i> You have been logged out successfully.
        </p>

        <form th:action="@{/admin/login}" method="post">

            <div class="input-group">
                <i class='bx bx-user'></i>
                <input type="text" name="username" placeholder="Username" required autofocus>
            </div>

            <div class="input-group">
                <i class='bx bx-key'></i>
                <input type="password" name="password" placeholder="Password" required>
            </div>

            <button type="submit">
                <i class='bx bx-log-in'></i> Login
            </button>

        </form>

        <a th:href="@{/}" class="back-link">
            <i class='bx bx-arrow-back'></i> Back to Portfolio
        </a>

    </div>

</div>

</body>
</html>
