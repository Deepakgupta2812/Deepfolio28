<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Certificate Form | Admin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>

<div class="admin-container">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="admin-content">

        <div class="form-container">

            <h1 th:text="${certificate.id == null ? 'Add Certificate' : 'Edit Certificate'}">Certificate Form</h1>
            <p>This appears as a card in the Certificates section of your portfolio.</p>

            <form th:action="@{/admin/certificates/save}" th:object="${certificate}" method="post" enctype="multipart/form-data">

                <input type="hidden" th:field="*{id}">

                <label>Certificate Title</label>
                <input type="text" th:field="*{title}" placeholder="Enter certificate title" required>

                <label>Organization</label>
                <input type="text" th:field="*{organization}" placeholder="Example: Coursera, Udemy, Oracle" required>

                <label>Issue Date</label>
                <input type="date" th:field="*{issueDate}" required>

                <label>Credential URL</label>
                <input type="url" th:field="*{credentialUrl}" placeholder="https://...">

                <label>Certificate Image</label>
                <input type="file" name="image" accept="image/png,image/jpeg,image/webp">
                <small class="form-help">Optional. PNG, JPG, or WebP up to 5 MB.</small>
                <img th:if="${certificate.imageData != null}" th:src="${certificate.imageData}" alt="Current certificate preview" class="certificate-preview">

                <div class="form-buttons">
                    <button type="submit" class="save-btn">
                        <i class='bx bx-save'></i> Save Certificate
                    </button>

                    <a th:href="@{/admin/certificates}" class="cancel-btn">
                        <i class='bx bx-x'></i> Cancel
                    </a>
                </div>

            </form>

        </div>

    </main>

</div>

</body>
</html>
